<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | Orkida Flowers</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241820">
<link rel="icon" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Login -->
<div class="login" id="login">
  <div class="card">
    <img src="assets/images/logo-circle.png" alt="Orkida">
    <h1>لوحة تحكم أوركيدا</h1>
    <p>سجّل الدخول لإدارة المتجر</p>
    <form class="f" id="loginForm">
      <input id="lUser" placeholder="اسم المستخدم" value="admin" autocomplete="username">
      <input id="lPass" type="password" placeholder="كلمة المرور" value="orkida2026" autocomplete="current-password">
      <button class="btn btn-p" style="justify-content:center;padding:13px">دخول</button>
    </form>
    <div class="hint">🔑 نسخة تجريبية — بيانات الدخول معبّأة تلقائياً</div>
    <p style="margin:14px 0 0"><a href="index.html" style="color:var(--pink);font-weight:700">← رجوع للمتجر</a></p>
  </div>
</div>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo"><img src="assets/images/logo-circle.png" alt=""><div><b>ORKIDA</b><small>لوحة التحكم</small></div></div>
    <nav class="menu" id="menu">
      <button data-v="dash" class="active"><span class="ic">📊</span>الرئيسية</button>
      <button data-v="orders"><span class="ic">🧾</span>الطلبات<span class="pill" id="newPill"></span></button>
      <button data-v="products"><span class="ic">💐</span>المنتجات</button>
      <button data-v="offers"><span class="ic">🏷️</span>العروض</button>
      <button data-v="reviews"><span class="ic">⭐</span>التقييمات<span class="pill" id="revPill"></span></button>
      <button data-v="reports"><span class="ic">📈</span>التقارير</button>
      <button data-v="settings"><span class="ic">⚙️</span>الإعدادات</button>
    </nav>
    <div class="bottom">
      <a href="index.html" target="_blank">🌐 عرض المتجر</a>
      <button id="resetBtn">♻️ إعادة بيانات الديمو</button>
      <button id="logoutBtn">🚪 تسجيل الخروج</button>
    </div>
  </aside>
  <main>
    <div class="mobile-top"><img src="assets/images/logo-circle.png" alt=""><a class="btn btn-g btn-sm" href="index.html" target="_blank">🌐 المتجر</a></div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
